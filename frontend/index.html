<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // gắn chế độ sáng/tối trước khi vẽ để không chớp màn hình (xem src/theme.ts)
      try {
        var t = localStorage.getItem("lvda:theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
    <title>LVDA · Hỏi và kiểm số liệu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
